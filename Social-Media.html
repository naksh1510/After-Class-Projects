<html>
<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Bootstrap CSS -->

<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />

<!-- My CSS -->

<style>
    #social-media {
        background-color: #2f3550;
    }

    .m-heading {
        font-weight: 700;
        margin-top: 6px;
    }

    .media_link {
        border: 2px solid #f2a900;
        border-radius: 4px;
        padding: 14px 18px;
        margin-right: 18px;
        background: transparent;
        text-align: left;
    }

    .row.pt-5 {
        gap: 18px;
    }

    .media_link h3 {
        font-size: 16px;
        font-weight: 600;
    }

    .media_link i {
        font-size: 22px;
    }

    .media_link.bg-warning {
        border: 2px solid #f2a900;
    }
</style>

<!-- Font Awesome -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<!-- Google Fonts -->

<link href="https://fonts.googleapis.com/css2?family=Barlow+TT:ital,wght@0,400;0,700;0,800;0,900;1,400&display=swap"
    rel="stylesheet" />

<body>
    <div id="social-media" class="container-fluid">
        <div class="container text-white py-5">
            <h1 class="text-warning">Social Media</h1>
            <h3 class="m-heading">Join Us!</h3>
            <div class="row pt-5">

                <!-- LinkedIn -->
                <a class="col-3 media_link btn text-decoration-none"
                    href="https://nz.linkedin.com/company/spice-of-india-restaurant-limited" target="_blank"
                    rel="noopener noreferrer">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pt-2 text-white">LinkedIn</h3>
                        </div>
                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fab fa-linkedin-in fa-2x text-secondary"></i>
                        </div>
                    </div>
                </a>

                <!-- YouTube -->
                <a class="col-3 media_link btn text-decoration-none" href="https://www.youtube.com/shorts/MbQkFT3yVY8"
                    target="_blank" rel="noopener noreferrer">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pt-2 text-white">YouTube</h3>
                        </div>
                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fab fa-youtube fa-2x text-secondary"></i>
                        </div>
                    </div>
                </a>

                <!-- Email -->
                <a class="col-3 media_link bg-warning btn text-decoration-none" href="mailto:hsb@saravanabhavan.com">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pt-2 text-white">Email</h3>
                        </div>
                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fas fa-envelope fa-2x text-white"></i>
                        </div>
                    </div>
                </a>

                <!-- Facebook -->
                <a class="col-3 media_link btn text-decoration-none"
                    href="https://www.facebook.com/SaravanaaBhavanLondon" target="_blank" rel="noopener noreferrer">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pt-2 text-white">Facebook</h3>
                        </div>
                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fab fa-facebook-f fa-2x text-secondary"></i>
                        </div>
                    </div>
                </a>

            </div>
        </div>
    </div>
</body>

</html>
